name: production-readiness
on:
  push:
    branches: [feat/transactional-concurrency, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tokad_test
          POSTGRES_PASSWORD: test_password_only
          POSTGRES_DB: tokad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokad_test -d tokad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: tokad_test
      POSTGRES_PASSWORD: test_password_only
      POSTGRES_DB: tokad_test
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync python manage.py check
      - run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - run: uv run --no-sync python -m pytest -q --create-db transactional/
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
