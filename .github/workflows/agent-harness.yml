name: Agent Harness

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/**'
      - '.agent/**'
      - 'scripts/agent/**'
      - '.github/workflows/agent-harness.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/**'
      - '.agent/**'
      - 'scripts/agent/**'
      - '.github/workflows/agent-harness.yml'

permissions:
  contents: read

jobs:
  docs-integrity:
    name: Agent documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run documentation checks
        run: bash scripts/agent/check-docs.sh

  verification-entrypoint:
    name: Verify harness entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: bash -n scripts/agent/verify.sh
      - name: Check documentation script syntax
        run: bash -n scripts/agent/check-docs.sh
